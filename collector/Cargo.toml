[package]
name = "collector"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.42"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
# `raw_value` for `serde_json::value::RawValue`. The collector's contract is
# that a recorded line is the payload exactly as the venue sent it, and the
# `premiumIndex` poller is the one place a payload is taken out of a larger
# response rather than off the wire whole. Without `RawValue` the element would
# have to go through `Value` and back, and `serde_json::Map` is a `BTreeMap` —
# the keys would come out sorted, so the file would hold something no venue
# ever sent. No new crate; the feature is serde_json's own.
serde_json = { version = "1.0.145", features = ["raw_value"] }
futures-util = "0.3.31"
# rustls, not native-tls. `native-tls` pulls in `openssl-sys`, which needs a
# target sysroot and therefore cannot be cross-compiled from macOS — the
# deploy path in deploy/cross-build-linux.sh fails outright with
# "Could not find directory of OpenSSL installation". It also makes the
# deployed binary depend on the host's libssl. The sibling `connector` crate
# already talks to these same venues over rustls, so this is a proven
# configuration, not a gamble.
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
# `env-filter` is required for `RUST_LOG` to have any effect: without it
# `fmt::init()` installs a static level filter and the unit's
# `Environment=RUST_LOG=...` is silently ignored.
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
anyhow = "1.0.100"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10.9"
hmac = "0.12.1"
thiserror = "2.0.16"
flate2 = "1.1.2"
# For statvfs. The collector fills a disk if left alone, and there is no way to
# ask for free space through std.
libc = "0.2"
clap = { version = "4.5.48", features = ["derive"] }

[dev-dependencies]
# `test-util` is not part of tokio's `full`, and it is what `tokio::time::pause`
# needs. The stall watchdog is measured in minutes; no test can afford to wait
# one, and one that slept for real would be a flaky test on a loaded machine.
tokio = { version = "1.47.1", features = ["full", "test-util"] }
