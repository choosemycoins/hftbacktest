# Hyperliquid connector — Phase 1: PUBLIC MARKET DATA ONLY.
#
# This backend subscribes to bbo + l2Book + trades and publishes depth and trade
# events. It holds no key, signs nothing, and REJECTS every order with
# ErrorKind::OrderError. Do not point a trading bot at it expecting fills.
#
# Run:
#   cargo run -p connector -- <connector-name> hyperliquid connector/examples/hyperliquid.toml
# where <connector-name> is the name the bot passes to Instrument::new.

# WebSocket endpoint.
#   testnet: wss://api.hyperliquid-testnet.xyz/ws
#   mainnet: wss://api.hyperliquid.xyz/ws
public_url = "wss://api.hyperliquid-testnet.xyz/ws"

# REST endpoint, used for `POST /info` to read the perp universe (szDecimals).
#   testnet: https://api.hyperliquid-testnet.xyz
#   mainnet: https://api.hyperliquid.xyz
#
# Must match `public_url`'s network: the two universes differ, and asset lists are
# reshuffled by delistings, so a coin validated on one network may not exist on the
# other.
rest_url = "https://api.hyperliquid-testnet.xyz"

# Which l2Book cadence to subscribe to. Both are FULL SNAPSHOTS, and only one may be
# subscribed: they carry different depths, so feeding both into one book would delete
# levels 6..20 on every fast frame and restore them on the next slow one.
#
#   "fast" —  5 levels a side, ~0.54 s  (default; the only cadence fast enough to quote on)
#   "slow" — 20 levels a side, ~5.4 s   (deeper, but stale for a market maker)
#
# The touch is additionally updated by every `bbo` frame (median ~0.14 s) in between,
# whichever cadence is chosen.
l2_book = "fast"

# Coins to validate and subscribe at startup, before any bot registers. Optional —
# a bot's own registration is added dynamically either way.
#
# Two reasons to set it: the connector refuses to start if a coin is not listed (an
# unknown coin closes the ENTIRE WebSocket with no error frame, taking every other
# subscription with it), and it makes the feed and the per-coin tick_size/lot_size
# observable without a bot attached.
#
# Names are the venue's own, case-sensitive: the canonical perp dex takes a bare coin
# (BTC, not BTCUSDT), and a HIP-3 builder dex takes its prefixed name (test:ABC).
coins = ["BTC", "ETH"]

# --- What the bot must register -------------------------------------------------------
#
# Hyperliquid publishes NO tick size. A price is legal if it has at most
# (6 - szDecimals) decimals and at most 5 significant figures, so the finest legal grid
# is derived from szDecimals alone:
#
#   tick_size = 10^-(6 - szDecimals)      lot_size = 10^-szDecimals
#
# The connector logs both per coin at subscribe time ("Resolved a Hyperliquid
# instrument"). The BOT declares them when it builds its Instrument, and nothing in the
# Connector trait lets this backend see or correct the bot's values. Copy the logged
# numbers — getting either wrong is silent, and NOT self-correcting:
#
#   * a coarser tick_size collapses two price levels into one in the connector's own
#     fused depth, so the bot quotes off a book that is wrong by a level;
#   * a coarser lot_size makes every level below it vanish before the bot sees it
#     (measured: 3 of 10 events dropped for BTC with lot_size = 0.001), and it does not
#     come back — a level below the bot's own lot is not representable in its book at
#     all, however many times the venue re-sends it.
#
# Measured on testnet 2026-07-28:
#   BTC (szDecimals 5): tick_size = 0.1     lot_size = 0.00001
#   ETH (szDecimals 4): tick_size = 0.01    lot_size = 0.0001
#
# --- Not configurable in Phase 1 ------------------------------------------------------
#
# There are no keys here, by design. Order submission, signing, the account address and
# the API-wallet key arrive in Phase 2; see docs/design-hyperliquid-connector.md §5.7.
# When they do, the key belongs OUTSIDE this file and outside git.

# --- Order path -----------------------------------------------------------------------
#
# Everything below is OPTIONAL. With no credentials configured the connector behaves
# exactly as before: it serves market data and refuses every order with
# ErrorKind::OrderError, saying so once at startup.

# Path to the credentials file. NEVER put the key in this file — this one is committed,
# copied into deployment repos and pasted into issues.
#
# The credentials file lives outside git at mode 600 and holds exactly two keys, named as
# Hyperliquid's own tooling names them:
#
#   api_wallet_private_key = "0x<64 hex>"   # the API wallet ("agent wallet"); signs actions
#   master_account_address = "0x<40 hex>"   # owns the positions; keys every query
#
# The environment variable HYPERLIQUID_CREDENTIALS overrides this, which is how one config
# serves several accounts.
#
# THE ASYMMETRY THAT CATCHES EVERYONE: actions are signed by the API wallet, but every
# state query and both private subscriptions use the MASTER address. Subscribing with the
# agent's address is accepted, acknowledged, and returns nothing — an account that appears
# never to trade.
#
# The API wallet must be approved by the master account in the Hyperliquid UI (API
# section). It cannot be approved with the agent key itself. Without approval every order
# comes back "User or API Wallet 0x… does not exist", which reads like a bad key and is
# not one; the connector probes `extraAgents` at startup and says so explicitly instead.
#
# credentials_path = "/home/you/.config/hftbacktest-connector/hl-testnet.toml"

# Which network the phantom-agent signature claims. MUST agree with the URLs above.
#
# Deliberately not derived from them: a URL can point at a proxy or a rehearsal harness,
# and guessing would be wrong exactly when it matters. The EIP-712 chainId is 1337 on BOTH
# networks — this flag is the only thing that distinguishes them, and getting it wrong
# yields a valid signature for an address the venue has never heard of.
is_mainnet = false

# Four hex characters stamped into the high nibbles of every client order id.
#
# Hyperliquid's cloid is a fixed 128-bit value (0x + exactly 32 hex characters), so unlike
# Bybit's orderLinkId it cannot carry readable text. This prefix is how the connector tells
# its own orders from a human's on the same account — orders whose prefix does not match are
# IGNORED, not reported as unknown and not cancelled. Give each connector process its own.
#
# It must be four HEXADECIMAL characters: a readable choice like "hf01" contains no valid
# hex digit and makes every cloid malformed, which the venue answers with an HTTP 422 on
# every single order.
order_prefix = "a1f0"

# What to do about orders already resting when the account stream connects.
#
#   "reconcile"  — ask the venue what is resting and adopt the answer (DEFAULT)
#   "cancel_all" — cancel everything for the registered coins and start clean, which is
#                  what the Bybit backend does unconditionally
#
# The default differs from Bybit's behaviour on purpose. Hyperliquid never cancels on
# disconnect, its resting orders survive restarts and API-wallet expiry, and this venue
# drops roughly nine sockets a day per connection — so cancelling on every reconnect turns
# a transient blip into a round trip through an empty book, and spends address-based
# rate-limit budget that only traded volume replenishes.
#
# Choose "cancel_all" when a restart must be guaranteed free of orders from the previous
# run (the myhft deployment shape); choose "reconcile" when quotes should survive a blip.
connect_policy = "reconcile"

# The master account address, cross-checked against the credentials file. Optional and
# worth setting: a credentials file pointing at a different account fails in the most
# confusing way available — orders sign and rest correctly while every position and fill
# describes somebody else. Set it and a mismatch is one line at startup.
#
# account_address = "0x0000000000000000000000000000000000000000"

# --- Not implemented in this phase ----------------------------------------------------
#
# * scheduleCancel (the dead-man's switch, design note §5.11). Hyperliquid has no
#   cancel-on-disconnect, so a connector that dies holding quotes leaves them resting until
#   something else removes them. Arming it needs the 10-triggers-per-UTC-day cap respected
#   and a testnet rehearsal, and is deliberately not guessed at here.
# * Rate-limit budget tracking (§5.9). The address-based limit is 1 request per 1 USDC of
#   traded volume with a 10,000-request initial buffer; a quoting bot that does not fill
#   spends budget it never replenishes, and at exhaustion the venue serves one request per
#   ten seconds. Nothing here counts it yet.
# * Order modify/amend. `Connector` has no `modify` method and `LiveBot::modify` is
#   `todo!()`, so cancel + submit is the only path.

# --- Supervision (generic; every backend reads these from its own config file) ---------
#
# Read by `connector/src/supervision.rs`, not by the backend. Both sections are optional
# and both default to the protective side.

[shutdown]
# Cancel the venue orders of every instrument a bot registered, when the connector stops
# on SIGINT/SIGTERM.
#
# ON by default, and that is the fail-closed choice: a connector that is going away cannot
# manage a resting order, so anything left behind is an unattended market maker until
# something reconnects and reconciles. Measured on a live testnet session (design note
# §11.14): a fill landed 3 s after a SIGINT and moved the position.
#
# Set false when the connector is restarted underneath a bot that keeps running and its
# quotes should survive the gap.
sweep_orders = true

# How long the publish task waits for the backends' stream tasks to let go before it stops
# anyway, in milliseconds.
#
# It does NOT bound the sweep — sweep_timeout_ms does, and the stop waits for the sweep
# before this starts counting. It used to bound both, which meant a 5 s ceiling on a sweep
# whose per-symbol allowance is 20 s: a stop could cancel half a grid and still report
# success.
#
# What it costs is the stop time of a backend that never winds its streams down. Only
# Hyperliquid implements `Connector::shutdown`; on bybit and the two Binance backends the
# stream tasks loop for ever, so their senders never drop and every stop waits out this
# deadline in full.
grace_ms = 5000

# How long the stop may spend cancelling before it gives up on the sweep, in milliseconds.
#
# The sweep is sequential over symbols and each one is several venue round trips — the
# Hyperliquid backend allows itself up to 20 s per symbol — so raise this for many symbols
# or a slow venue. It exists so a connector cannot hang on SIGTERM against an unreachable
# venue.
#
# Running out is reported loudly AND EXITS NON-ZERO: whatever was not cancelled is still
# resting on the venue with nothing managing it, which is the failure the sweep exists to
# prevent, so it is not a clean stop however orderly the rest of it was.
sweep_timeout_ms = 30000

[bot_liveness]
# Cancel a bot's orders when the bot stops heartbeating.
#
# A bot's orders outlive the bot, and between a bot's death and its supervisor's restart
# nobody is managing them. `LiveBot` sends `LiveRequest::Heartbeat` from inside `elapse`,
# so this notices a bot whose event loop has wedged as well as one whose process is gone.
#
# ON by default and safe to leave on: a bot is watched only after it has heartbeated at
# least once, so a bot built before the heartbeat existed is never swept. The connector
# stays up afterwards for the bot to reconnect to.
enabled = true

# Silence, in milliseconds, after which a heartbeating bot is presumed dead.
#
# What it must clear is the bot's HEARTBEAT INTERVAL (LiveBotBuilder::heartbeat_interval,
# one second by default), not the duration of its `elapse` calls: a bot blocked waiting for
# a feed or for its own order response caps each receive at that interval and keeps
# reporting throughout, so a 60 s `wait_order_response` on a silent feed still heartbeats
# 60 times. Ten seconds is an order of magnitude of headroom. Too short and a healthy but
# slow bot has its orders cancelled underneath it.
timeout_ms = 10000
